name: Test using pytest

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [  "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for PySide6 (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # MINT develop tracks the latest iplot-* repos on develop; the
          # PyPI releases lag behind. Install the dev branches first so
          # the ".[test]" install below does not pull older PyPI wheels.
          pip install git+https://github.com/iplot-viz/iplotLogging.git@develop
          pip install git+https://github.com/iplot-viz/iplotProcessing.git@develop
          pip install git+https://github.com/iplot-viz/iplotDataAccess.git@develop
          pip install git+https://github.com/iplot-viz/iplotWidgets.git@develop
          pip install git+https://github.com/iplot-viz/iplotlib.git@develop
          pip install ".[test]"

      - name: Verify embedded user manual is up to date
        run: python -m mint.tools.build_manual --check

      - name: Automated tests with Pytest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run pytest

      - name: Automated tests with Pytest (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}
          path: coverage.xml
